<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>title only</title>
  <script src="../dist/vv-html-components.js"></script>
</head>
<body>
  <div class="ux-render-root" data-ux-correlation="corr-title">
    <main data-ux-node-cid="cid:node:shell" data-ux-node-id="shell-001"
          data-ux-component-kind="PageShell" data-ux-acia-digest="sha256:aaa"
          data-ux-token-digest="sha256:bbb" data-ux-content-role="context"
          aria-label="Governance">
      <span data-ux-label>Governance</span>
      <ul data-ux-node-cid="cid:node:list" data-ux-node-id="list-001"
          data-ux-component-kind="DataList" data-ux-acia-digest="sha256:aaa"
          data-ux-token-digest="sha256:bbb" data-ux-content-role="evidence"
          aria-label="Records">
        <span data-ux-label>Records</span>
        <article data-ux-node-cid="cid:node:row" data-ux-node-id="row-001"
                 data-ux-component-kind="DrillDownCard" data-ux-acia-digest="sha256:aaa"
                 data-ux-token-digest="sha256:bbb" data-ux-content-role="evidence"
                 aria-label="Row">
          <span data-ux-label>Row</span>
        </article>
      </ul>
    </main>
  </div>
</body>
</html>
