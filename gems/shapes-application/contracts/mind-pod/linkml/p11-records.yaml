# Profile 11 record shapes, FIRST CUT, derived from the Ruby vocabulary.
#
# NOT hand-authored. gems/rails-osi-level-8/lib/rails_osi_level_8/profile11/
# vocabulary.rb already carries the allow-list per record type (TYPE_KEYS) and
# the five maturity dimensions as closed vocabularies (DIMENSIONS). Those are
# the constraints the old profile-11-meaning-operations.ttl header claimed and
# did not contain. This schema restates them where a generator can reach them.
#
# FIRST CUT means: cardinality is inferred, not asserted. Every slot here is
# optional because the Ruby does not say which are required -- TYPE_KEYS is an
# allow-list, and an allow-list says what MAY appear, not what MUST. Marking a
# slot required on a guess would refuse a legitimate record, which is worse
# than the closed-world refusal this already provides.
#
# What IS asserted, because the vocabulary asserts it: the permitted keys per
# type (via sh:closed on the generated shape) and the five enumerations.
id: https://w3id.org/cpcp/osi8/meaning/records
name: p11_records
title: Profile 11 record types
description: >-
  The thirteen Profile 11 record types and the closed vocabularies their
  dimension slots draw from, derived from RailsOsiLevel8::Profile11::Vocabulary.
license: https://creativecommons.org/publicdomain/zero/1.0/

prefixes:
  linkml: https://w3id.org/linkml/
  mng: https://w3id.org/cpcp/osi8/meaning#
default_prefix: mng
default_range: string

imports:
