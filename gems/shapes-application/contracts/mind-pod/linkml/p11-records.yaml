# Profile 11 record shapes, derived from the Ruby vocabulary.
#
# NOT hand-authored. Profile11::Vocabulary already carries the allow-list per
# record type (TYPE_KEYS) and the five maturity dimensions as closed
# vocabularies (DIMENSIONS). Those are the constraints the file this replaces
# claimed in its header and did not contain.
#
# Two things here are decisions, not derivations, and are marked as such.
#
# SERVER-AUTHORITATIVE KEYS ARE OMITTED. cid, digest and ledgerPlacement are in
# TYPE_KEYS for every record, but BACK stamps them. P1 already refuses a
# client-supplied ledgerPlacement -- "client must not supply ledger placement"
# -- and the reason generalises: a caller that can stamp its own placement is
# deciding the thing it is supposed to be asking about. Omitted rather than
# forbidden, because sh:closed refuses what is not named and
# maximum_cardinality: 0 would PERMIT one (see LinkMlGaps.md).
#
# NOTHING IS REQUIRED HERE, AND THAT IS THE POINT.
#
# TYPE_KEYS is an allow-list: it says what MAY appear, not what MUST. An
# earlier cut of this file required an "identity" slot per type -- target for
# SemanticDispute, refersTo for StewardshipTranslation, criterion for
# EligibilityExplanation. Those are APPLICATION decisions, and magentic-stack
# is the substrate (ADR 0063). Deciding which slot makes a record "about"
# something is exactly the substrate naming its consumers' semantics, which
# 0063 forbids and which the Grounding else-branch comment already warns about.
#
# What the substrate CAN assert, and does: the permitted keys per type (via
# sh:closed), the five closed vocabularies, and that BACK stamps its own
# fields. Those are protocol invariants, true of every consumer.
#
# An overlay that knows its own semantics declares requiredness with
# Grounding.register_twin, whose violations are appended to these rather than
# replacing them.
