# The MIND Pod canonical topology: ONE Rails 8 app (app/) mounting rails-cpcp,
# run as roles from ONE image (the "extract"): BACK (CPCP seam + domain writer),
# FRONT (browser page, DBless, talks to BACK over CPCP), BACKJOB (domain writer
# of Reconciliation, sharing BACK's db volume), VAULT (provider secrets; pod-internal),
# CONFIG (operator UI; vault's first caller; host-published).
# Plus MIND (the agent client), SWITCH (the LLM plane), GRAPH, and NATS
# (12th container: in-pod L7 broker, ADR 0065).
# Domain state writers are BACK and BACKJOB (ADR 0056). The split is
# config/domain_writers.json.
#
# GRAPH is Oxigraph: an RDF PROJECTION of the Rails models, not the authority.
# Every node references a Rails Model, class or instance. See ../graph/README.md.
# Storable project_on_save! is wired. Writers must set MM_OXIGRAPH_URL or
# Execute defaults to localhost:7878 inside the container, which is not GRAPH.
#
# SWITCH holds no provider key of its own (vault does, row 11 slice A) and
# MIND holds none: MIND names no model and carries no credential, it just
# asks switch. The pod ships NO local model, so the default path is a
# remote vendor and DOES egress -- set a key in the vault UI on
# http://localhost:13003 (slot switchyard.<vendor>).
#
# The app image is a THIN LAYER on rails-base: run bin/build-baselines first,
# or use bin/docker-containers up, which builds the base when it is missing.
# Gate 1 Part C brings up only `back` and drives it with test/mind_boundary_test.py.
# The full FRONT web-page demo is app/extract/compose.yml (used by ../../bootstrap).
name: mind-pod
services:
  back:
    build: { context: ./app, dockerfile: Dockerfile }
    image: mind-pod:latest
    # MM_OXIGRAPH_URL: mmg-graph Execute defaults to localhost:7878, which inside
    # this container is nothing. Without it graph.query fails closed rather than
    # reaching GRAPH.
    depends_on: [ graph, nats ]
    environment: { ROLE: back, PORT: "3000", HTTP_BIND: "127.0.0.1", DB_PATH: /data/mind_pod.sqlite3, BASE_IRI: "https://mind-pod.local", BACK_URL: "http://back:3000", MM_OXIGRAPH_URL: "http://graph:7878", VV_GRAPH_TRIPLE_GATE: "strict", MM_NATS_URL: "nats://nats:4222" }
    volumes: [ "mind-data:/data" ]
  backjob:
    image: mind-pod:latest
    depends_on: [ back, nats ]
    environment: { ROLE: backjob, DB_PATH: /data/mind_pod.sqlite3, BACKJOB_INTERVAL: "8", BACK_URL: "http://back:3000", MM_OXIGRAPH_URL: "http://graph:7878", VV_GRAPH_TRIPLE_GATE: "strict", MM_NATS_URL: "nats://nats:4222" }
    volumes: [ "mind-data:/data" ]
  bus:
    # ROLE=bus (row 18). CPCP seam + async projection. Not RES. Unpublished.
    # Owns the BUS sqlite on the bus-data named volume (BUS_DB_PATH).
    # Mounts the domain sqlite read-only as the projection SOURCE (row 72:
    # BACK never dials bus; bus reads BACK's journal, it does not call it).
    image: mind-pod:latest
    depends_on: [ back, nats ]
    environment: { ROLE: bus, PORT: "3000", HTTP_BIND: "127.0.0.1", DB_PATH: /data/mind_pod.sqlite3, BUS_DB_PATH: /bus-data/bus.sqlite3, MM_NATS_URL: "nats://nats:4222" }
    volumes: [ "bus-data:/bus-data", "mind-data:/data:ro" ]
  rag:
    # ROLE=rag (RagContainer.md option 3). The seam IS the rag.* contract; the
    # Milvus engine stays official and unforked. Own CPCP seam, unpublished.
    # Mounts no domain store: the index is a projection of text BACK already
    # journalled, never an admission of its own.
    image: mind-pod:demo
    depends_on: [ nats, milvus ]
    environment: { ROLE: rag, PORT: "3000", HTTP_BIND: "127.0.0.1", MILVUS_URL: "http://milvus:19530", MM_NATS_URL: "nats://nats:4222" }
    expose: [ "3000" ]
  persist:
    # ROLE=persist (row 8). Placement authority. Own CPCP seam, unpublished.
    # Owns the PERSIST sqlite on the persist-data named volume; mounts no
    # domain store (the ledger cannot live in the file it places).
    # Callers allowlisted: empty PERSIST_CALLERS fails closed at boot.
    image: mind-pod:latest
    depends_on: [ nats ]
    environment: { ROLE: persist, PORT: "3000", HTTP_BIND: "127.0.0.1", PERSIST_DB_PATH: /persist-data/persist.sqlite3, PERSIST_CALLERS: "${PERSIST_CALLERS:-}", MM_NATS_URL: "nats://nats:4222" }
    volumes: [ "persist-data:/persist-data" ]
  front:
    image: mind-pod:latest
    depends_on: [ back, nats ]
    environment: { ROLE: front, PORT: "3000", HTTP_BIND: "127.0.0.1", BACK_URL: "http://back:3000", MM_NATS_URL: "nats://nats:4222" }
  vault:
    # Own container, shared Rails image (ADR 0047 amendment). Pod-internal only.
    # No default caller token: empty VAULT_CALLERS fails closed at boot (ADR 0046).
    # Bind mount, not a named volume: keys must survive `down -v`.
    image: mind-pod:latest
    depends_on: [ nats ]
    environment:
      ROLE: vault
      PORT: "3000"
      VAULT_STORE_PATH: /vault/secrets.json
      VAULT_MASTER_KEY: "${VAULT_MASTER_KEY:-}"
      VAULT_CALLERS: "${VAULT_CALLERS:-}"
      SECRET_KEY_BASE: "${VAULT_SECRET_KEY_BASE:-}"
      MM_NATS_URL: "nats://nats:4222"
      HTTP_BIND: "127.0.0.1"
    volumes: [ "../../.agent/vault:/vault" ]
  config:
    # Operator UI (ADR 0046). Host-published. Talks to vault over NATS;
    # put+list only, never get. Empty VAULT_TOKEN fails closed at boot.
    # Persist's first caller (row 41): set+get placements. Empty
    # PERSIST_TOKEN fails closed at boot.
    # Switch display lives in config-admin now (row 11 slices B–C);
    # FRONT :13000 is extract's web page.
    image: mind-pod:latest
    depends_on: [ vault, nats ]
    environment:
      ROLE: config
      PORT: "3000"
      VAULT_URL: "http://vault:3000"
      VAULT_TOKEN: "${CONFIG_VAULT_TOKEN:-}"
      PERSIST_URL: "http://persist:3000"
      PERSIST_TOKEN: "${CONFIG_PERSIST_TOKEN:-}"
      SWITCH_UI_URL: "http://switch:8790"
      SECRET_KEY_BASE: "${CONFIG_SECRET_KEY_BASE:-}"
      MM_NATS_URL: "nats://nats:4222"
      HTTP_BIND: "0.0.0.0"
    # LOOPBACK, NAMED. Without a host interface Docker binds 0.0.0.0, so an
    # operator surface is reachable from wherever the host is. scopes.md
    # defines pod_external as reachable from the host, NEVER from the open
    # internet; the address is what makes that true.
    ports: [ "127.0.0.1:13003:3000" ]
  shape:
    # ROLE=shape v1 (ADR 0049). Retrieval of ProfileCatalog files by digest.
    # Pod-internal. Not host-published (gap 61). No domain DB.
    image: mind-pod:latest
    depends_on: [ nats ]
    environment: { ROLE: shape, PORT: "3000", HTTP_BIND: "127.0.0.1", MM_NATS_URL: "nats://nats:4222" }
  mind:
    build: { context: ./mind, dockerfile: Dockerfile }
    image: mind-pod-mind:latest
    depends_on:
      back:
        condition: service_started
      switch:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      BACK_URL: "http://back:3000"
      SWITCH_URL: "http://switch:8789/v1"
      MM_NATS_URL: "nats://nats:4222"
      NOOA_COMMIT: "8b3c719"
      MIND_INTERVAL: "12"
      # Row-10 seam: served pod-internal on 8091, never published. Callers
      # allowlisted; empty MIND_CALLERS refuses every call but never stops
      # the cognition cycle (the seam fails closed, the process does not).
      MIND_CALLERS: "${MIND_CALLERS:-}"
      # NOOA embeds SQLite and defaults to :memory:. DB_PATH binds it
      # (ADR 0051). NAMED volume, not a bind mount: agent memory is not
      # a credential, `down -v` is meant to clear it, and NOOA ships
      # virtiofs detection because SQLite misbehaves on Docker Desktop
      # file sharing -- a named volume sidesteps that.
      DB_PATH: /mind-data/nooa.sqlite3
    volumes: [ "mind-nooa-data:/mind-data" ]
    expose: [ "8091" ]
  switch:
    build: { context: ../.. , dockerfile: gems/adapters/nemo-switchyard/Dockerfile }
    image: mind-pod-switch:latest
    depends_on: [ nats ]
    environment:
      # No local runtime ships with the pod. Point this at one you run yourself
      # to re-enable the zero-egress path; unset, local reports NOT ready.
      OLLAMA_URL: "${OLLAMA_URL:-}"
      # mlx_lm.server on the host. Unset means the mlx vendor is not ready,
      # which is the honest answer; from a container the host is
      # host.docker.internal, not 127.0.0.1.
      MLX_URL: "${MLX_URL:-}"
      MM_NATS_URL: "nats://nats:4222"
      # Row 11 slice A: provider keys come from VAULT (llm-plane get), never
      # the state file. Unset/misconfigured reads as missing_credential.
      VAULT_URL: "http://vault:3000"
      SWITCH_VAULT_TOKEN: "${SWITCH_VAULT_TOKEN:-}"
    # Agent-level bind mount, NOT a named volume: routing state (active,
    # enabled, prices, discovered, verified) must survive `down -v`.
    # Keys no longer live here (vault); the mount form is unchanged (row 46).
    volumes: [ "../../.agent/secrets:/state" ]
    # Both planes pod-internal, neither published (row 11 slice C retired
    # :13001): 8789 data for MIND, 8790 UI for config-admin's display.
    expose: [ "8789", "8790" ]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/api/sources').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s
  milvus:
    # THE ENGINE. Third-party, unforked, digest-pinned, unpublished -- the same
    # exemption class as graph (oxigraph) and nats (ADR 0047
    # exemption_conditions). We ship no source into it and do not fork it.
    #
    # Named for the product, as nats is. RagContainer.md called this container
    # `rag`, but that was written before the CPCP face was chosen: with
    # ROLE=rag the seam owns that name, the way every other Rails role does,
    # and the engine needs its own.
    #
    # Standalone in ONE process: embedded etcd and local storage, so etcd and
    # minio stay engine internals rather than becoming extra CPCP roles or
    # gap-table rows (RagContainer.md, "One compose service").
    image: milvusdb/milvus@sha256:38a6ba6378c602bfb187f4f34077f384c160edf1cf329aa22d99fb58b81b2497
    command: [ "milvus", "run", "standalone" ]
    environment:
      # Without DEPLOY_MODE the binary calls itself distributed and refuses
      # the embedded etcd outright: "embedded etcd can not be used under
      # distributed mode".
      DEPLOY_MODE: STANDALONE
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
    volumes: [ "rag-data:/var/lib/milvus" ]
    configs:
      - source: milvus_embed_etcd
        target: /milvus/configs/embedEtcd.yaml
    # Unpublished. gRPC never leaves the docker network; the seam is the only
    # way in, which is the point of giving it one.
    expose: [ "19530" ]
  graph:
    image: oxigraph/oxigraph@sha256:e68b3625743db4a4b18129a907ae36766f89bb6deeb8ab50d35685dbabe00b0e
    command: ["serve", "--location", "/data", "--bind", "0.0.0.0:7878"]
    volumes: [ "graph-data:/data" ]
    expose: [ "7878" ]
  nats:
    # 12th container (ADR 0065). Third-party L7 in-pod broker; analog of graph.
    # Official image, digest-pinned, no build context, no source bind-mount,
    # unpublished. JetStream store on named volume nats-data. Not ROLE=bus
    # (BUS is the Rails metadata seam). In-pod CPCP rides NATS so HTTP ports
    # inside the pod can be disabled; host-published HTTP remains the only
    # HTTP that faces the operator.
    image: nats:2.11.16@sha256:8f093cb30e8bfed2eff4bbea70dfcbffd847be40ec674b9f7a7b9d26f41234b2
    command: ["-js", "-sd", "/data", "-p", "4222"]
    volumes: [ "nats-data:/data" ]
    expose: [ "4222" ]
    # No healthcheck: the scratch image ships neither curl nor a shell
    # (same reason graph has none). Clients depend_on start, not healthy.
volumes:
  mind-nooa-data: {}
  mind-data: {}
  bus-data: {}
  persist-data: {}
  graph-data: {}
  nats-data: {}
  rag-data: {}

configs:
  # The embedded etcd config the image does NOT ship. Supplied as a compose
  # config rather than a bind-mount, so no source tree is mounted into a
  # third-party container and the image stays unforked (RagContainer.md).
  milvus_embed_etcd:
    content: |
      listen-client-urls: http://0.0.0.0:2379
      advertise-client-urls: http://0.0.0.0:2379
      quota-backend-bytes: 4294967296
      auto-compaction-mode: revision
      auto-compaction-retention: '1000'
