# The extracted demo: the mind-pod app as ONE image run as THREE roles, plus MIND.
# back = sole writer + /_cpcp seam ; backjob = async reconciler (shares db volume);
# front = browser page, DBless, talks to back over CPCP. Browse http://localhost:13000
# mind = the NOOA agent client (its own image); reaches Effect ONLY through back's
# /_cpcp seam. Cognition is deterministic unless MIND_MODEL + MIND_API_KEY are set.
name: mind-pod-demo
services:
  back:
    build: { context: .. , dockerfile: Dockerfile }
    image: mind-pod:demo
    environment: { ROLE: back, PORT: "3000", DB_PATH: /data/mind_pod.sqlite3, BASE_IRI: "https://mind-pod.local" }
    volumes: [ "mind-data:/data" ]
    expose: [ "3000" ]
  backjob:
    image: mind-pod:demo
    depends_on: [ back ]
    environment: { ROLE: backjob, DB_PATH: /data/mind_pod.sqlite3, BACKJOB_INTERVAL: "8" }
    volumes: [ "mind-data:/data" ]
  front:
    image: mind-pod:demo
    depends_on: [ back ]
    environment: { ROLE: front, PORT: "3000", BACK_URL: "http://back:3000" }
    ports: [ "13000:3000" ]
  mind:
    build: { context: ../../mind, dockerfile: Dockerfile }
    image: mind-pod-mind:demo
    depends_on: [ back ]
    environment:
      BACK_URL: "http://back:3000"
      NOOA_COMMIT: "8b3c719"
      MIND_INTERVAL: "12"
      # LLM path is opt-in (default-deny egress); unset = deterministic cognition.
      MIND_MODEL: "${MIND_MODEL:-}"
      MIND_API_KEY: "${MIND_API_KEY:-}"
      MIND_API_BASE: "${MIND_API_BASE:-}"
volumes:
  mind-data: {}
