# The extracted demo: the mind-pod app as ONE image run as THREE roles, plus MIND.
# back = /_cpcp seam + domain writer ; backjob = domain writer of Reconciliation
# (shares db volume); front = browser page, DBless, talks to back over CPCP.
# Writers are BACK and BACKJOB (ADR 0056). Browse FRONT at http://localhost:13000
# (the web page). Host CPCP is BACK at http://localhost:13002/_cpcp -- FRONT
# is route-gated off /_cpcp, so curling :13000/_cpcp 404s.
# mind = the NOOA agent client (its own image); reaches Effect ONLY through back's
# /_cpcp seam, and gets every completion from switch (it holds no key, names no model).
# switch = SwitchYard, the LLM plane. The pod ships NO local model container, so
# the default path is a remote vendor and DOES egress: set a key at
# http://localhost:13001 (fireworks is wired). The local source class survives and
# still bypasses the egress gate, but it is ready only if you point OLLAMA_URL at
# a runtime you run yourself.
# graph = Oxigraph. An RDF PROJECTION of the Rails models, not the authority.
# Domain state is written by BACK and BACKJOB (ADR 0056). See ../../../graph/README.md.
name: mind-pod-demo
services:
  back:
    build: { context: .. , dockerfile: Dockerfile }
    image: mind-pod:demo
    depends_on: [ graph ]
    # MM_OXIGRAPH_URL: mmg-graph Execute defaults to localhost:7878, which inside
    # this container is nothing. Without it graph.query fails closed rather than
    # reaching GRAPH. Canonical compose already sets both vars; extract did not.
    environment: { ROLE: back, PORT: "3000", DB_PATH: /data/mind_pod.sqlite3, BASE_IRI: "https://mind-pod.local", BACK_URL: "http://back:3000", MM_OXIGRAPH_URL: "http://graph:7878", VV_GRAPH_TRIPLE_GATE: "strict" }
    volumes: [ "mind-data:/data" ]
    expose: [ "3000" ]
    # Host CPCP for 3dot/curl. Distinct from FRONT :13000 (web page) and
    # SWITCH :13001 (UI). In-pod MIND still uses http://back:3000.
    ports: [ "13002:3000" ]
    healthcheck:
      # The image ships no curl/wget; ruby is always present.
      test: ["CMD", "ruby", "-e", "require %q(net/http); exit(Net::HTTP.get_response(URI(%q(http://127.0.0.1:3000/up))).code == %q(200) ? 0 : 1)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
  backjob:
    image: mind-pod:demo
    depends_on:
      back:
        condition: service_healthy
    environment: { ROLE: backjob, DB_PATH: /data/mind_pod.sqlite3, BACKJOB_INTERVAL: "8", BACK_URL: "http://back:3000", MM_OXIGRAPH_URL: "http://graph:7878", VV_GRAPH_TRIPLE_GATE: "strict" }
    volumes: [ "mind-data:/data" ]
  bus:
    # ROLE=bus (row 18). CPCP seam + async projection. Not RES. Unpublished.
    # Owns the BUS sqlite on the bus-data named volume (BUS_DB_PATH).
    # Mounts the domain sqlite read-only as the projection SOURCE.
    image: mind-pod:demo
    depends_on:
      back:
        condition: service_healthy
    environment: { ROLE: bus, PORT: "3000", DB_PATH: /data/mind_pod.sqlite3, BUS_DB_PATH: /bus-data/bus.sqlite3 }
    volumes: [ "bus-data:/bus-data", "mind-data:/data:ro" ]
    expose: [ "3000" ]
  persist:
    # ROLE=persist (row 8). Placement authority. Own CPCP seam, unpublished.
    # Owns the PERSIST sqlite on the persist-data named volume; mounts no
    # domain store (the ledger cannot live in the file it places).
    # Callers allowlisted: empty PERSIST_CALLERS fails closed at boot.
    image: mind-pod:demo
    environment: { ROLE: persist, PORT: "3000", PERSIST_DB_PATH: /persist-data/persist.sqlite3, PERSIST_CALLERS: "${PERSIST_CALLERS:-}" }
    volumes: [ "persist-data:/persist-data" ]
    expose: [ "3000" ]
  front:
    image: mind-pod:demo
    depends_on:
      back:
        condition: service_healthy
    environment: { ROLE: front, PORT: "3000", BACK_URL: "http://back:3000" }
    ports: [ "13000:3000" ]
  vault:
    # Own container, shared Rails image. Not published. Empty tokens fail closed.
    image: mind-pod:demo
    environment:
      ROLE: vault
      PORT: "3000"
      VAULT_STORE_PATH: /vault/secrets.json
      VAULT_MASTER_KEY: "${VAULT_MASTER_KEY:-}"
      VAULT_CALLERS: "${VAULT_CALLERS:-}"
      SECRET_KEY_BASE: "${VAULT_SECRET_KEY_BASE:-}"
    volumes: [ "../../../../.agent/vault:/vault" ]
    expose: [ "3000" ]
  config:
    # Operator UI (ADR 0046). Host-published at :13003. Vault caller:
    # put+list, never get. Empty token fails closed. Row 15 lands here.
    image: mind-pod:demo
    depends_on: [ vault ]
    environment:
      ROLE: config
      PORT: "3000"
      VAULT_URL: "http://vault:3000"
      VAULT_TOKEN: "${CONFIG_VAULT_TOKEN:-}"
      SECRET_KEY_BASE: "${CONFIG_SECRET_KEY_BASE:-}"
    ports: [ "13003:3000" ]
  shape:
    # ROLE=shape v1 (ADR 0049). Retrieval of ProfileCatalog files by digest.
    # Pod-internal. Not host-published (gap 61). No domain DB.
    image: mind-pod:demo
    environment: { ROLE: shape, PORT: "3000" }
    expose: [ "3000" ]
  mind:
    build: { context: ../../mind, dockerfile: Dockerfile }
    image: mind-pod-mind:demo
    depends_on:
      back:
        condition: service_healthy
      switch:
        condition: service_healthy
    environment:
      BACK_URL: "http://back:3000"
      SWITCH_URL: "http://switch:8789/v1"
      NOOA_COMMIT: "8b3c719"
      MIND_INTERVAL: "12"
      # NOOA embeds SQLite and defaults to :memory:. DB_PATH binds it
      # (ADR 0051). NAMED volume, not a bind mount: agent memory is not
      # a credential, `down -v` is meant to clear it, and NOOA ships
      # virtiofs detection because SQLite misbehaves on Docker Desktop
      # file sharing -- a named volume sidesteps that.
      DB_PATH: /mind-data/nooa.sqlite3
    volumes: [ "mind-nooa-data:/mind-data" ]
  switch:
    build: { context: ../../../.. , dockerfile: gems/adapters/nemo-switchyard/Dockerfile }
    image: mind-pod-switch:demo
    environment:
      # No local runtime ships with the pod. Set OLLAMA_URL to reach one you run
      # yourself; unset, the local vendor reports NOT ready rather than failing
      # at call time.
      OLLAMA_URL: "${OLLAMA_URL:-}"
    # Agent-level bind mount, NOT a named volume: keys must survive `down -v`.
    # Path is relative to this compose file; .agent/ is gitignored at the repo root.
    volumes: [ "../../../../.agent/secrets:/state" ]
    # 8789 (data) is deliberately NOT published: pod-internal only. 8790 is the UI.
    expose: [ "8789" ]
    ports: [ "13001:8790" ]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/api/sources').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s
  graph:
    image: oxigraph/oxigraph@sha256:e68b3625743db4a4b18129a907ae36766f89bb6deeb8ab50d35685dbabe00b0e
    command: ["serve", "--location", "/data", "--bind", "0.0.0.0:7878"]
    volumes: [ "graph-data:/data" ]
    expose: [ "7878" ]
    # No healthcheck yet, deliberately. The oxigraph image is minimal and may ship
    # neither curl nor a shell, so an unverified CMD-SHELL probe would sit red
    # forever and read as a broken store rather than an unproven check. back
    # depends_on graph at start, not healthy. Add a real probe when there is
    # something to prove beyond process start.
volumes:
  mind-nooa-data: {}
  mind-data: {}
  bus-data: {}
  persist-data: {}
  graph-data: {}
