# The extracted demo: the mind-pod app as ONE image run as THREE roles, plus MIND.
# back = sole writer + /_cpcp seam ; backjob = async reconciler (shares db volume);
# front = browser page, DBless, talks to back over CPCP. Browse http://localhost:13000
# mind = the NOOA agent client (its own image); reaches Effect ONLY through back's
# /_cpcp seam, and gets every completion from switch (it holds no key, names no model).
# switch = SwitchYard, the LLM plane. The pod ships NO local model container, so
# the default path is a remote vendor and DOES egress: set a key at
# http://localhost:13001 (fireworks is wired). The local source class survives and
# still bypasses the egress gate, but it is ready only if you point OLLAMA_URL at
# a runtime you run yourself.
# graph = Oxigraph. An RDF PROJECTION of the Rails models, not the authority --
# back remains the sole writer. See ../../../graph/README.md.
name: mind-pod-demo
services:
  back:
    build: { context: .. , dockerfile: Dockerfile }
    image: mind-pod:demo
    environment: { ROLE: back, PORT: "3000", DB_PATH: /data/mind_pod.sqlite3, BASE_IRI: "https://mind-pod.local" }
    volumes: [ "mind-data:/data" ]
    expose: [ "3000" ]
    healthcheck:
      # The image ships no curl/wget; ruby is always present.
      test: ["CMD", "ruby", "-e", "require %q(net/http); exit(Net::HTTP.get_response(URI(%q(http://127.0.0.1:3000/up))).code == %q(200) ? 0 : 1)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
  backjob:
    image: mind-pod:demo
    depends_on:
      back:
        condition: service_healthy
    environment: { ROLE: backjob, DB_PATH: /data/mind_pod.sqlite3, BACKJOB_INTERVAL: "8" }
    volumes: [ "mind-data:/data" ]
  front:
    image: mind-pod:demo
    depends_on:
      back:
        condition: service_healthy
    environment: { ROLE: front, PORT: "3000", BACK_URL: "http://back:3000" }
    ports: [ "13000:3000" ]
  mind:
    build: { context: ../../mind, dockerfile: Dockerfile }
    image: mind-pod-mind:demo
    depends_on:
      back:
        condition: service_healthy
      switch:
        condition: service_healthy
    environment:
      BACK_URL: "http://back:3000"
      SWITCH_URL: "http://switch:8789/v1"
      NOOA_COMMIT: "8b3c719"
      MIND_INTERVAL: "12"
  switch:
    build: { context: ../../../.. , dockerfile: runtimes/switch/Dockerfile }
    image: mind-pod-switch:demo
    environment:
      # No local runtime ships with the pod. Set OLLAMA_URL to reach one you run
      # yourself; unset, the local vendor reports NOT ready rather than failing
      # at call time.
      OLLAMA_URL: "${OLLAMA_URL:-}"
    # Agent-level bind mount, NOT a named volume: keys must survive `down -v`.
    # Path is relative to this compose file; .agent/ is gitignored at the repo root.
    volumes: [ "../../../../.agent/secrets:/state" ]
    # 8789 (data) is deliberately NOT published: pod-internal only. 8790 is the UI.
    expose: [ "8789" ]
    ports: [ "13001:8790" ]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/api/sources').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s
  graph:
    image: oxigraph/oxigraph@sha256:e68b3625743db4a4b18129a907ae36766f89bb6deeb8ab50d35685dbabe00b0e
    command: ["serve", "--location", "/data", "--bind", "0.0.0.0:7878"]
    volumes: [ "graph-data:/data" ]
    expose: [ "7878" ]
    # No healthcheck yet, deliberately. The oxigraph image is minimal and may ship
    # neither curl nor a shell, so an unverified CMD-SHELL probe would sit red
    # forever and read as a broken store rather than an unproven check. Nothing
    # depends on graph being healthy today. Add a real probe when the projection
    # lands and there is something to prove.
volumes:
  mind-data: {}
  graph-data: {}
