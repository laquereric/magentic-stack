# CI override: publish BACK's port so the Part C runtime negative-test (a
# MIND-style client) can reach the /_cpcp seam from the host. Canonical
# BACK binds HTTP to loopback (in-pod CPCP is NATS); CI must bind 0.0.0.0
# so the published port is reachable.
services:
  back:
    environment: { HTTP_BIND: "0.0.0.0" }
    ports: ["3000:3000"]
