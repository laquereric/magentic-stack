# Pilot release-gate aggregator - runs all six gates, assembles the signed
# governance-evidence bundle, and makes ONE release decision.
# Decision policy: FAIL only on a real gate FAILURE. A gate that is still a stub
# reports "skipped" -> the aggregator stays green but release_ready = false.
name: release-gates
on:
  workflow_dispatch:
  push:
    tags: [ 'stack-*' ]
permissions:
  id-token: write
  contents: read
  attestations: write
jobs:
  boundary:    { uses: ./.github/workflows/boundary-conformance.yml }
  shacl:       { uses: ./.github/workflows/shacl-conformance.yml }
  attestation: { uses: ./.github/workflows/attestation.yml }
  pins:        { uses: ./.github/workflows/reversible-pins.yml }
  offline:     { uses: ./.github/workflows/offline-boundary.yml }
  governance:
    needs: [ boundary, shacl, attestation, pins, offline ]
    uses: ./.github/workflows/governance-evidence.yml
  decision:
    name: pilot-release-gate / decision
    needs: [ governance ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: evidence-governance, path: gov }
      - name: Release decision (fail only on a real gate FAILURE)
        run: |
          python3 - <<'PY'
          import json, sys
          b = json.load(open("gov/governance-evidence.v1.json"))
          print("bundle_digest:", b["bundle_digest"])
          print("release_ready:", b["release_ready"])
          print("gate_failures:", b["gate_failures"])
          print("gates_skipped:", b["gates_skipped"])
          for g in b["gates"]:
              print("  -", g["gate"], "=>", g["status"])
          sys.exit(1 if b["gate_failures"] else 0)
          PY
