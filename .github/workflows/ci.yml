# General CI. The release DECISION is made by release-gates.yml (the six gates);
# this verifies the monorepo builds - notably the owned Rails plane as ONE bundle -
# and that every suite in the tree actually runs.
#
# The monorepo is CLOSED (ADR 0038): these gems have no other home, so this is
# the only CI that covers them. Before closure each had a standalone repo;
# archiving removed that safety net and this replaces it.
name: ci
on:
  workflow_call:
  push: { branches: [ main ] }
  pull_request:
jobs:
  ruby-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: One root bundle builds the owned plane + every component loads
        run: bundle exec ruby bin/load-all

  # Every suite in gems/, tooling/ and runtimes/. This replaces three per-gem jobs
  # that covered only docker-swap, effect-plane and slo -- ten other suites in the
  # tree ran nowhere. Fails closed: no suites found, or an exclusion that matches
  # no suite, is an error.
  gem-suites:
    runs-on: ubuntu-latest
    env:
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: rspec across every owned component
        run: ./bin/spec-all

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Integration tests
        run: |
          echo "TODO: run integration-tests/ (see docs/plans/pilot-release-gates.md)"
