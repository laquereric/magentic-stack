# General CI. The release DECISION is made by release-gates.yml (the six gates);
# this verifies the monorepo builds - notably the owned Rails plane as ONE bundle.
name: ci
on:
  workflow_call:
  push: { branches: [ main ] }
  pull_request:
jobs:
  ruby-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: One root bundle builds the owned Rails plane + all engines load
        run: |
          bundle exec ruby -e 'require "rails-cpcp"; require "rails-osi-level-8"; require "rails-threedot-back"; require "mmg-switchyard"; require "vv-docker-swap"; require "mmg-effect-plane"; require "vv-slo"; puts "loaded cpcp=#{RailsCpcp::VERSION} osi8=#{RailsOsiLevel8::VERSION} threedot=#{RailsThreedotBack::VERSION} switchyard=#{Mmg::Switchyard::VERSION} docker_swap=#{Vv::DockerSwap::VERSION} effect_plane=#{Mmg::EffectPlane::VERSION} slo=#{Vv::Slo::VERSION}"'
  docker-swap:
    runs-on: ubuntu-latest
    env:
      LANG: en_US.UTF-8
    defaults:
      run:
        working-directory: tooling/docker-swap
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: tooling/docker-swap
      - name: rspec (vv-docker-swap)
        run: bundle exec rspec
  effect-plane:
    runs-on: ubuntu-latest
    env:
      LANG: en_US.UTF-8
    defaults:
      run:
        working-directory: runtimes/effect-plane
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: runtimes/effect-plane
      - name: rspec (mmg-effect-plane)
        run: bundle exec rspec
  slo:
    runs-on: ubuntu-latest
    env:
      LANG: en_US.UTF-8
    defaults:
      run:
        working-directory: tooling/slo
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: tooling/slo
      - name: rspec (vv-slo)
        run: bundle exec rspec
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Integration tests
        run: |
          echo "TODO: run integration-tests/ (see docs/plans/pilot-release-gates.md)"
