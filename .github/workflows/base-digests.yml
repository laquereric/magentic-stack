# Registry FROM lines in gems/runtimes/tooling must carry an OCI index digest.
# upstreams/ and vendored trees are excluded (do-not-fork). Stage names and
# local ARG FROM are skipped. A Dockerfile outside scan+exclusion fails.
name: gate-base-digests
on:
  push: { branches: [ main ] }
  pull_request:
    paths: [ '**/Dockerfile', '**/Dockerfile.*', 'tooling/pins/**' ]
  workflow_call:
jobs:
  base-digests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Dockerfile FROM lines carry @sha256 index digests
        run: python3 tooling/pins/check_base_digests.py
