# Gate 6 - signed governance evidence export (REAL).
# Collects the per-gate reports from this run, generates a real SBOM (syft:
# CycloneDX + SPDX), and assembles a tamper-evident governance-evidence.v1 bundle
# (revision + gate statuses + pin current/rollback + SBOM digests + bundle_digest).
# The bundle is signed best-effort via GitHub artifact attestation (SLSA provenance).
name: gate-governance-evidence
on:
  workflow_call:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
  attestations: write
jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Collect gate evidence from this run (if any)
        uses: actions/download-artifact@v4
        with: { path: collected, pattern: 'evidence-*', merge-multiple: true }
        continue-on-error: true
      - name: Generate SBOM (syft - CycloneDX + SPDX)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/syft" scan dir:. -q -o cyclonedx-json=sbom.cdx.json -o spdx-json=sbom.spdx.json
          ls -la sbom.cdx.json sbom.spdx.json
      - name: Assemble governance-evidence.v1 bundle
        run: |
          mkdir -p collected
          python3 tooling/governance/assemble_bundle.py \
            --evidence-dir collected \
            --sbom sbom.cdx.json --sbom sbom.spdx.json \
            --out governance-evidence.v1.json
      - name: Sign bundle (best-effort SLSA provenance attestation)
        id: attest
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: governance-evidence.v1.json
      - name: Record signing outcome
        if: always()
        run: echo "attestation_outcome=${{ steps.attest.outcome }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-governance
          path: |
            governance-evidence.v1.json
            sbom.cdx.json
            sbom.spdx.json
            evidence/governance-evidence.json
