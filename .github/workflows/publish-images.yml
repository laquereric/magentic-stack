# The substrate publishes its base images (ADR 0063).
#
# Until this existed, mind-pod-rails-base was a local build-time tag and two
# workflow comments said it "does not exist and never will" as a pullable name.
# An application overlay therefore had to clone this repo and build three images
# itself -- including MIND, which needs the nooa submodule vendored first.
#
# Immutable tag per commit: sha-<full SHA>. No :latest. A mutable tag is not a
# pin, and this repo already refuses undigested FROM lines (check_base_digests).
# Consumers resolve and pin the digest:
#   docker buildx imagetools inspect ghcr.io/laquereric/magentic-stack/rails-base:sha-<SHA>
#
# The set of images published here is declared in tooling/pins/published_images.json
# and held both ways by check_published_images.py: a Dockerfile in neither list
# fails, so adding an image is a decision rather than an omission.
name: publish-images
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  declared:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.set.outputs.images }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: the published set is declared and holds both ways
        run: python3 tooling/pins/check_published_images.py
      - id: set
        name: read the declared set
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          led = json.load(open("tooling/pins/published_images.json"))
          print("images=" + json.dumps(led["published"]))
          PY

  publish:
    needs: declared
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.declared.outputs.images) }}
    steps:
      - uses: actions/checkout@v4

      # MIND cannot build from a plain clone: nooa is a pinned submodule and
      # mind/vendor/nooa is gitignored. This is the single strongest reason to
      # publish rather than have every consumer reproduce it.
      - name: prepare
        if: ${{ matrix.image.prepare != '' && matrix.image.prepare != null }}
        run: ${{ matrix.image.prepare }}

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push ${{ matrix.image.name }}
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ghcr.io/laquereric/magentic-stack/${{ matrix.image.name }}:sha-${{ github.sha }}

      - name: report the digest a consumer should pin
        run: |
          echo "### ${{ matrix.image.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/laquereric/magentic-stack/${{ matrix.image.name }}:sha-${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "digest ${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
