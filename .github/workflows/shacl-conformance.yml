# Gate 2 - closed SHACL validation, every OSI Level 8 profile shipped in the tree.
# Validates the consolidated profile shapes vendored at gems/osi-level-8-profiles
# (profiles without fixtures: well-formed SHACL; with fixtures: valid-conforms / invalid-fails).
# The validator reports the count it actually ran -- do not hardcode a number here.
name: gate-shacl-conformance
on:
  push: { branches: [ main ] }
  pull_request:
    paths: [ 'grammar/**', 'gems/**', 'tooling/shacl/**' ]
  workflow_call:
jobs:
  shacl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3' }
      - name: Install pinned SHACL toolchain
        run: pip install -r tooling/shacl/requirements.txt
      # A shape and its enforcement are two artifacts: the TTL, which this gate
      # validates and the server never executes, and Grounding's Ruby cases, which
      # the server executes and nothing validated. Without this step a constraint
      # can be tightened in SHACL, pass the gate with its fixtures, and change
      # nothing about what the seam admits -- a green gate reporting on a document
      # the server does not read. Review 2026-08-28 F2.
      - name: Shape/enforcement drift (TTL vs Grounding)
        id: drift
        continue-on-error: true
        env: { EVIDENCE_OUT: evidence/shape-drift.json }
        run: mkdir -p evidence && python3 tooling/shacl/check_shape_drift.py
      - name: Validate closed SHACL shapes (OSI Level 8 profiles)
        run: |
          set -o pipefail
          mkdir -p evidence
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if python3 gems/osi-level-8-profiles/scripts/validate.py 2>&1 | tee evidence/shacl.log; then status=pass; else status=fail; fi
          drift='${{ steps.drift.outcome }}'
          if [ "$drift" != success ]; then status=fail; fi
          # Carry the drift DENOMINATORS into the gate report. "0 drift" is a
          # statement about the shapes that were compared, and the ratio only
          # existed in stdout.
          drift_assert=$(cat evidence/shape-drift.json 2>/dev/null \
            | python3 -c 'import json,sys;d=json.load(sys.stdin);print(json.dumps({k:d[k] for k in ["shapes_compared","ttl_shapes_with_enforceable_constraints","runtime_cases","drift_count","shapes_in_both_trees","cross_tree_problems"]}))' \
            2>/dev/null || echo '{"shape_drift":"unavailable"}')
          finished=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          passes=$(grep -c '^  PASS' evidence/shacl.log || true)
          fails=$(grep -c '^  FAIL' evidence/shacl.log || true)
          cat > evidence/shacl-validation.json <<JSON
          { "gate": "shacl-validation", "status": "$status",
            "subject": "${{ github.sha }}", "policy": "closed-shapes OSI Level 8 profiles (osi-level-8-profiles)",
            "started_at": "$started", "finished_at": "$finished",
            "tool": "pyshacl==0.40.1",
            "assertions": [ { "checks_pass": $passes, "checks_fail": $fails }, $drift_assert ],
            "digests": {} }
          JSON
          cat evidence/shacl-validation.json
          test "$status" = pass
      # P10 ships shapes AND a Ruby allowlist in rails-osi-level-8. Two expressions
      # of one rule drift at two rates unless something compares them.
      - name: P10 shapes vs validator.rb alignment
        run: python3 gems/osi-level-8-profiles/scripts/check_p10_alignment.py
      # The vocabulary is DERIVED from the normative shapes, so the check is that
      # the derivation is current -- regenerate and diff. Comparing two
      # implementations to each other, as this step used to, would let them agree
      # perfectly while both drifted from the spec.
      - name: ACIA term vocabulary is current with the Profile 9 shapes
        run: |
          ruby gems/mmg-acia/bin/sync-terms-from-spec gems/osi-level-8-profiles
          git diff --exit-code -- gems/mmg-acia/db/seeds/acia_terms.yml
      # The shapes say what an ACIA document IS; the projection is one
      # implementation of them. Nothing checked that the second satisfied the
      # first, and it had drifted.
      - name: Profile 9 RDF projection conforms to the Profile 9 shapes
        run: python3 gems/osi-level-8-profiles/scripts/check_projection_conformance.py
      # The other half of what a tree produces: what a model reads, governed by
      # Profile 2 rather than Profile 9.
      - name: mmg-acia cognition projection conforms to the Profile 2 shapes
        run: python3 gems/osi-level-8-profiles/scripts/check_cognition_conformance.py
      # Phase 0: every NodeShape is named; a wrap of an unlisted shape fails.
      # Does not change what any operation admits or refuses.
      - name: Shape binding manifest matches the tree
        run: python3 tooling/shacl/check_shape_binding.py
      # Step 2: unowned is a call-site count; quarantine dispositions must match
      # the SHACL reference graph. Does not delete anything.
      - name: Shape quarantine inventory matches the reference graph
        run: python3 tooling/shacl/check_shape_quarantine.py
      # Step 3: four TTL documents, constraint-level ledger. CONFLICTS are the
      # finding. Does not merge, move, or edit TTL. Does not touch shape_root.
      - name: Shape constraint ledger matches the four documents
        run: python3 tooling/shacl/check_shape_constraint_ledger.py
      # Step 4: empty gem skeletons. Protocol must not depend on application.
      # Does not move TTL or touch shape_root.
      - name: Shape gem dependency direction (application -> level-8 only)
        run: python3 tooling/shacl/check_shape_gem_deps.py
      # Step 5: wrap-site Ruby vs TTL closed-shape IR. Divergences are recorded,
      # not reconciled. Does not move TTL or touch shape_root.
      - name: Wrap-site runtime artifact matches recorded divergences
        run: python3 tooling/shacl/check_shape_runtime_artifact.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: evidence-shacl-validation, path: 'evidence/shacl-validation.json' }
