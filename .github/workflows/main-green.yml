# Row 114: main is refused unless the host checker+plant sweep is green.
# This workflow cannot un-push; the pre-push hook is the refuse.
# CI is the net for --no-verify and for clones that skipped install-hooks.
name: gate-main-green
on:
  push: { branches: [ main ] }
  pull_request:
  workflow_call:
jobs:
  sweep:
    runs-on: ubuntu-latest
    env:
      LANG: en_US.UTF-8
    steps:
      # SUBMODULES, because the sweep runs check_repo_format and that checker
      # reads the contract out of upstreams/coordination-protocol-contract-package.
      # Without them it says so plainly -- "the submodule ... is not checked out,
      # so the contract this repo's manifests cite cannot check them ... this is
      # rot, not a skip" -- and it is right. boundary-conformance, ci, monty-pin
      # and switchyard-pin already check out recursively; this job runs a
      # superset of their checkers and was the one fetching less.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      # THE SAME SCRIPT A DEVELOPER RUNS. This job used to hand-roll its own pip
      # lines and build no venv at all, so the runner and the laptop were
      # provisioned by different code against different requirement sets -- the
      # structural reason a sweep could be green here and red there, and why
      # four hypotheses died before the cause was found on 2026-09-20.
      # bin/install-hooks reads tooling/governance/sweep.json, installs every
      # declared requirements file into .venv, and refuses if the result cannot
      # import every declared module. It also gives the runner a REAL .venv, so
      # tools that resolve their binaries relative to one (the LinkML
      # generators) find them here exactly as they do locally.
      - name: Provision the toolchain (same script as a developer clone)
        run: bin/install-hooks
      # PER-GEM BUNDLES. bundler-cache: true installs the ROOT Gemfile and
      # nothing else, but four checkers shell out to `bundle exec rspec` inside
      # a DIFFERENT gem directory, each of which has its own Gemfile. Those
      # bundles were never installed here, so the runner said "bundler: command
      # not found: rspec" and eight jobs failed -- four checkers and the four
      # plants that wrap them. It never reproduced on a developer machine
      # because bin/spec-all installs these bundles per group, so anyone who had
      # run the suites already had them.
      #
      # DERIVED FROM THE CHECKERS, NOT LISTED HERE. A hardcoded list would go
      # stale the first time someone adds a fifth checker that shells into a gem
      # -- silently, because the symptom is a missing executable rather than a
      # missing entry. Zero derived directories is a failure, not a no-op: the
      # same reasoning as every "empty population is not a pass" gate in
      # tooling/.
      - name: Per-gem bundles the sweep's checkers shell into
        run: |
          set -euo pipefail
          dirs=$(grep -l '"bundle"' tooling/*/check_*.py tooling/*/plant_*.py 2>/dev/null \
                 | xargs grep -ho 'gems/[a-z0-9_-]*' 2>/dev/null | sort -u)
          n=0
          while IFS= read -r d; do
            [ -n "$d" ] || continue
            [ -f "$d/Gemfile" ] || { echo "no Gemfile, skipped: $d"; continue; }
            echo "== bundle install in $d"
            ( cd "$d" && bundle install --jobs 4 )
            n=$((n+1))
          done <<< "$dirs"
          echo "per-gem bundles installed: $n"
          [ "$n" -gt 0 ] || { echo "FAIL: derived zero gem bundles; the grep that finds them has gone stale" >&2; exit 1; }
      - name: Install versioned hooks
        run: git config core.hooksPath tooling/githooks
      - name: Full checker + plant sweep
        run: python3 bin/sweep
