# Credential stores stay bind mounts while ADR 0046:85 stands (gap 46 / 113).
name: gate-credential-bind-mounts
on:
  push: { branches: [ main ] }
  pull_request:
    paths:
      - 'runtimes/mind-pod/docker-compose.yml'
      - 'runtimes/mind-pod/app/extract/compose.yml'
      - 'runtimes/mind-pod/app/app/services/vault/store.rb'
      - 'runtimes/switch/sources.mjs'
      - 'docs/adr/0046-vault-is-not-the-config-ui.md'
      - 'tooling/compose/check_credential_bind_mounts.py'
      - 'tooling/population.py'
  workflow_call:
jobs:
  credential-bind-mounts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Credential stores are JSON bind mounts, not named volumes
        run: python3 tooling/compose/check_credential_bind_mounts.py
