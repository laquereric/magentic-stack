# Gate 4 - reversible upstream pins (REAL).
# Proves each pinned upstream can ADVANCE to pinned_revision and ROLL BACK to
# rollback_target (both fetched + checked out in an isolated clone), and that the
# manifest agrees with the committed submodule gitlink (no drift).
# Part 2 (TODO): SBOM/provenance per pin + running the CPCP contract against each
# candidate/rollback (needs gems/adapters + runtimes/). See docs/plans/.
name: gate-reversible-pins
on:
  push: { branches: [ main ] }
  pull_request:
    paths: [ 'upstreams/**', 'tooling/pins/**' ]
  workflow_call:
jobs:
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4    # gitlink read from the tree; submodule checkout not required
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Reversible-pins check (advance + rollback round-trip, no drift)
        run: python3 tooling/pins/check_reversible_pins.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: evidence-reversible-pins, path: 'evidence/reversible-pins.json' }
