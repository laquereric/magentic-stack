# Plugins build/test CI - integrates the ThreeDot developer tooling into the
# monorepo build (not a release gate; a build check).
name: plugins
on:
  workflow_call:
  push: { branches: [ main ] }
  pull_request:
    paths: [ 'plugins/**' ]
jobs:
  threedot-vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/threedot-vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: npm run compile
      - run: npm run check:commands
      - run: npm run test:parse
  threedot-back:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/threedot-back
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: plugins/threedot-back
      - name: Load the engine (Rails 8)
        run: bundle exec ruby -e 'require "rails-threedot-back"; puts "loaded rails-threedot-back " + RailsThreedotBack::VERSION'
  switchyard-routing:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
    defaults:
      run:
        working-directory: plugins/switchyard-routing
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: plugins/switchyard-routing
      - name: rspec (Switchyard LLM-assist routing proof)
        run: bundle exec rspec
